name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: haxball-room-token
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Verify package
        run: |
          npm run lint
          npm run type-check
          npm run build
          node -e "const pkg = require('haxball.js'); if (typeof pkg.default !== 'function') throw new Error('Invalid CommonJS entrypoint')"
          node --input-type=module -e "import HaxballJS from 'haxball.js'; if (typeof HaxballJS !== 'function') throw new Error('Invalid ESM entrypoint')"

      - name: Run tests
        shell: bash
        env:
          TEST_HB_HEADLESS_TOKEN: ${{ secrets.HEADLESS_TEST_TOKEN }}
        run: |
          if [[ -z "$TEST_HB_HEADLESS_TOKEN" ]]; then
            echo "HEADLESS_TEST_TOKEN is not configured" >&2
            exit 1
          fi
          npm test

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_FILE="haxball.js-$VERSION.tgz"
          PUBLISHED="$(npm view haxball.js versions --json --prefer-online | node -e '
            const versions = JSON.parse(require("node:fs").readFileSync(0, "utf8"))
            console.log([].concat(versions).includes(process.argv[1]))
          ' "$VERSION")"
          if [[ "$PUBLISHED" == false ]]; then
            npm pack
            npm publish "./$PACKAGE_FILE" --access public --provenance
          fi

          # npm can accept a publish before the exact version is available for download.
          PUBLISHED_DIR="$(mktemp -d "$RUNNER_TEMP/haxball-npm.XXXXXX")"
          PACK_LOG="$PUBLISHED_DIR/npm-pack.log"
          for attempt in {1..13}; do
            # npm pack checks the tarball against the registry's published integrity.
            if npm pack "haxball.js@$VERSION" --prefer-online --color=false --pack-destination "$PUBLISHED_DIR" >"$PACK_LOG" 2>&1; then
              cat "$PACK_LOG"
              break
            fi
            if (( attempt == 13 )) || ! grep -Eq '^npm (error|ERR!) code (ETARGET|E404)[[:space:]]*$' "$PACK_LOG"; then
              cat "$PACK_LOG" >&2
              exit 1
            fi
            echo "Waiting for haxball.js@$VERSION to become available on npm (attempt $attempt of 13)"
            sleep 30
          done
          PUBLISHED_PACKAGE="$PUBLISHED_DIR/$PACKAGE_FILE"
          if ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"; then
            if grep -Fxq "$PACKAGE_FILE" <<< "$ASSETS"; then
              EXISTING_DIR="$(mktemp -d "$RUNNER_TEMP/haxball-release.XXXXXX")"
              gh release download "$GITHUB_REF_NAME" --pattern "$PACKAGE_FILE" --dir "$EXISTING_DIR"
              if ! cmp -s "$PUBLISHED_PACKAGE" "$EXISTING_DIR/$PACKAGE_FILE"; then
                echo "GitHub release asset differs from the published npm tarball" >&2
                exit 1
              fi
            else
              gh release upload "$GITHUB_REF_NAME" "$PUBLISHED_PACKAGE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$PUBLISHED_PACKAGE" --generate-notes --verify-tag
          fi
